<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChambaYa | Encuentra trabajo rápido</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container row">
        <h1>ChambaYa</h1>
        <nav>
          <a href="#empleos">Empleos</a>
          <a href="#empresas">Empresas</a>
          <a href="#publicar">Publicar vacante</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero container">
        <h2>Encuentra tu próxima chamba en minutos</h2>
        <p>Plataforma de empleos estilo marketplace para candidatos y empresas.</p>
        <div class="search-box">
          <input id="q" type="text" placeholder="Puesto o palabra clave" />
          <select id="city">
            <option value="">Todas las ciudades</option>
            <option>Lima</option>
            <option>Arequipa</option>
            <option>Trujillo</option>
            <option>Remoto</option>
          </select>
          <button id="searchBtn">Buscar</button>
        </div>
      </section>

      <section id="empleos" class="container jobs-section">
        <div class="section-head">
          <h3>Empleos destacados</h3>
          <span id="resultsCount"></span>
        </div>
        <div id="jobsList" class="jobs-grid"></div>
      </section>

      <section id="publicar" class="container publish">
        <h3>Publica una vacante</h3>
        <form id="jobForm" class="card">
          <input name="title" placeholder="Puesto" required />
          <input name="company" placeholder="Empresa" required />
          <input name="location" placeholder="Ubicación" required />
          <input name="salary" placeholder="Salario (ej: S/ 3000)" required />
          <textarea name="description" rows="4" placeholder="Descripción" required></textarea>
          <button type="submit">Publicar empleo</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Demo educativa inspirada en portales de empleo tipo Chambea.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
